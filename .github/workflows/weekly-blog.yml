# Weekly blog publish (added 2026-10-15). Posts are staged ahead of time in
# _blog/posts.json (with date="YYYY-MM-DD") + _blog/posts/<slug>.html.
# _blog/build_blog.py only renders posts dated today or earlier (Vancouver),
# so this Monday rebuild is what makes the next one live: page, blog.html,
# sitemap and BlogPosting schema in one commit. Nothing due = no commit.
name: Weekly blog publish

on:
  schedule:
    - cron: "10 15 * * 1"   # Mondays 15:10 UTC (08:10 PDT / 07:10 PST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: weekly-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # sitemap lastmod reads git history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build (date-gated)
        run: python _blog/build_blog.py

      - name: Commit and push if a post went live
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing staged for today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Weekly blog publish $(TZ=America/Vancouver date +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      # Proof = the served page, not the commit. Fails the run (GitHub emails
      # the repo owner) if the newest post is not live within 15 minutes.
      - name: Prove the newest post is served
        if: steps.commit.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import json, sys, time, urllib.request
          sys.path.insert(0, "_blog")
          import build_blog as b
          live = [p for p in json.load(open("_blog/posts.json")) if p["date"] <= b.TODAY]
          p = max(live, key=lambda p: p["date"])
          url = f"{b.CANONICAL}/{p['slug']}.html"
          for _ in range(30):
              try:
                  body = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", "ignore")
                  if "BlogPosting" in body:
                      print("LIVE", url)
                      sys.exit(0)
              except Exception as e:
                  print("not yet:", e)
              time.sleep(30)
          sys.exit(f"NOT LIVE after 15 min: {url}")
          PY
